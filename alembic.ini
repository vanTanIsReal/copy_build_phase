[alembic]
# Migration scripts live next to the models they describe, not at the repo root - keeps DB schema
# history inside src/db/ alongside src/db/models.py and src/db/session.py.
script_location = src/db/migrations
prepend_sys_path = .

# sqlalchemy.url is deliberately NOT set here - src/db/migrations/env.py reads DATABASE_URL from
# src.config.get_settings() (same source the app itself uses) so migrations always run against
# whatever database the app is actually configured for, dev/test/CI/production alike, with no
# secret duplicated into a tracked config file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
