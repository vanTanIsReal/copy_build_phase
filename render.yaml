services:
  - type: web
    name: orbit-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: google
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: DAILY_TOKEN_BUDGET
        value: "150000"
      - key: CALENDAR_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: SCHEDULER_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_REGISTER
        value: 5/minute
      - key: RATE_LIMIT_CHAT
        value: 15/minute
      - key: RATE_LIMIT_CRUD
        value: 60/minute
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
