  <circle cx="879" cy="203" r="9" fill="#BCA9FF"/>
  <circle cx="906" cy="514" r="8" fill="#8FF0C3"/>

  <g fill="#fff">
    <text x="70" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">P-132 · AI20K</text>
    <text x="70" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-2">ORBIT AI ASSISTANT</text>
