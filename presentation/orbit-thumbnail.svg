  <circle cx="642" cy="357" r="300" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1140" cy="110" r="170" fill="#5ECAFF" opacity=".08"/>
  <circle cx="95" cy="670" r="220" fill="#A758FF" opacity=".09"/>

