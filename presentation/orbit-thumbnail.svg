<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Orbit AI Assistant — Biến hội thoại thành hành động</title>
  <desc id="desc">Ảnh đại diện dự án Orbit với quỹ đạo, bong bóng hội thoại, task và lịch.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1190" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A36"/>
      <stop offset=".48" stop-color="#273A84"/>
      <stop offset="1" stop-color="#705CF4"/>
    </linearGradient>
    <linearGradient id="orb" x1="447" y1="151" x2="831" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8E9FF"/>
      <stop offset=".48" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#B460FF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7B9CFF" stop-opacity=".52"/>
      <stop offset="1" stop-color="#7B9CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#050A1C" flood-opacity=".34"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
