name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.multi_agent_enabled }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - multi_agent_enabled: "false"
            product_delivery_agent_enabled: "false"
            quality_assurance_agent_enabled: "false"
            executive_agent_enabled: "false"
          - multi_agent_enabled: "true"
            product_delivery_agent_enabled: "true"
            quality_assurance_agent_enabled: "true"
            executive_agent_enabled: "true"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Verify PostgreSQL migrations
        run: alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orbit_test
          MULTI_AGENT_ENABLED: ${{ matrix.multi_agent_enabled }}
          PRODUCT_DELIVERY_AGENT_ENABLED: ${{ matrix.product_delivery_agent_enabled }}
          QUALITY_ASSURANCE_AGENT_ENABLED: ${{ matrix.quality_assurance_agent_enabled }}
          EXECUTIVE_AGENT_ENABLED: ${{ matrix.executive_agent_enabled }}

      - name: Run backend tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          MULTI_AGENT_ENABLED: ${{ matrix.multi_agent_enabled }}
          PRODUCT_DELIVERY_AGENT_ENABLED: ${{ matrix.product_delivery_agent_enabled }}
          QUALITY_ASSURANCE_AGENT_ENABLED: ${{ matrix.quality_assurance_agent_enabled }}
          EXECUTIVE_AGENT_ENABLED: ${{ matrix.executive_agent_enabled }}

  frontend:
    name: Build user and admin frontends
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build user and admin frontends
        working-directory: Frontend
        run: npm run build
