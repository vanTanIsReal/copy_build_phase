name: Deploy

# Runs only after CI has gone green on main (workflow_run), or on demand via the Actions tab
# (workflow_dispatch) - e.g. for the very first deploy, since workflow_run can't fire from the
# same push that first adds this file. See docs/deploy.md step 12.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set - see docs/deploy.md step 6." >&2
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for backend to become healthy
        run: |
          if [ -z "${{ vars.RENDER_URL }}" ]; then
            echo "RENDER_URL repository variable is not set - see docs/deploy.md step 6." >&2
            exit 1
          fi
          url="${{ vars.RENDER_URL }}/health"
          echo "Polling $url ..."
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Not ready yet (attempt $i/30), retrying in 10s..."
            sleep 10
          done
          echo "Backend did not become healthy in time." >&2
          exit 1
